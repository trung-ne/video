<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Form document -->
  <rect x="25" y="25" width="110" height="120" rx="4" fill="#FFF9E6"/>
  <!-- Form border -->
  <rect x="25" y="25" width="110" height="120" rx="4" fill="none" stroke="#FFD166" stroke-width="2"/>
  <!-- Header -->
  <rect x="25" y="25" width="110" height="22" fill="#FFD166"/>
  <text x="80" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" font-family="Arial">TAX FORM</text>
  <!-- Form fields -->
  <line x1="35" y1="55" x2="125" y2="55" stroke="#CCCCCC" stroke-width="1"/>
  <text x="35" y="52" font-size="8" fill="#666" font-family="Arial">Income:</text>
  <line x1="35" y1="70" x2="125" y2="70" stroke="#CCCCCC" stroke-width="1"/>
  <text x="35" y="67" font-size="8" fill="#666" font-family="Arial">Deductions:</text>
  <line x1="35" y1="85" x2="125" y2="85" stroke="#CCCCCC" stroke-width="1"/>
  <text x="35" y="82" font-size="8" fill="#666" font-family="Arial">Total Tax:</text>
  <!-- Dollar amount -->
  <rect x="100" y="75" width="30" height="25" rx="3" fill="#FF6B6B"/>
  <text x="115" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="Arial">$</text>
  <!-- Checkbox (tax return filed) -->
  <rect x="35" y="105" width="12" height="12" rx="2" fill="#27AE60"/>
  <polyline points="38,111 41,114 45,108" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="115" font-size="9" fill="#333" font-family="Arial">Filed & Verified</text>
  <!-- Calendar icon (due date) -->
  <rect x="115" y="105" width="16" height="16" rx="2" fill="#3498DB"/>
  <line x1="118" y1="105" x2="128" y2="105" stroke="white" stroke-width="1"/>
  <circle cx="120" cy="112" r="1" fill="white"/>
  <circle cx="124" cy="112" r="1" fill="white"/>
</svg>
