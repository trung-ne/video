<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Stack of bills shadow -->
  <rect x="24" y="72" width="114" height="64" rx="6" fill="#5A9E5A" opacity="0.3"/>
  <!-- Bill back -->
  <rect x="22" y="68" width="114" height="60" rx="6" fill="#4CAF50"/>
  <rect x="22" y="64" width="114" height="60" rx="6" fill="#56BE56"/>
  <!-- Main bill -->
  <rect x="22" y="60" width="114" height="60" rx="6" fill="#66BB6A"/>
  <!-- Bill border -->
  <rect x="28" y="66" width="102" height="48" rx="4" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <!-- Center oval -->
  <ellipse cx="79" cy="90" rx="22" ry="18" fill="#4CAF50"/>
  <!-- Dollar sign -->
  <text x="79" y="97" text-anchor="middle" font-size="26" font-weight="bold" fill="white" font-family="Arial">$</text>
  <!-- Corner numbers -->
  <text x="36" y="80" font-size="12" font-weight="bold" fill="white" font-family="Arial">100</text>
  <text x="110" y="110" font-size="12" font-weight="bold" fill="white" font-family="Arial" text-anchor="end">100</text>
  <!-- Coins -->
  <circle cx="42" cy="48" r="16" fill="#FFD700"/>
  <circle cx="42" cy="48" r="12" fill="#FFC107"/>
  <text x="42" y="53" text-anchor="middle" font-size="12" font-weight="bold" fill="#8B6914" font-family="Arial">¢</text>
  <circle cx="118" cy="44" r="14" fill="#FFD700"/>
  <circle cx="118" cy="44" r="10" fill="#FFC107"/>
  <text x="118" y="49" text-anchor="middle" font-size="11" font-weight="bold" fill="#8B6914" font-family="Arial">¢</text>
</svg>
