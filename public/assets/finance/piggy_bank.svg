<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Piggy body -->
  <ellipse cx="75" cy="100" rx="48" ry="42" fill="#FF8FB3"/>
  <!-- Snout -->
  <circle cx="40" cy="95" r="13" fill="#FF8FB3"/>
  <!-- Ears -->
  <ellipse cx="60" cy="55" rx="11" ry="20" fill="#FF8FB3"/>
  <ellipse cx="90" cy="55" rx="11" ry="20" fill="#FF8FB3"/>
  <!-- Ear inner -->
  <ellipse cx="60" cy="62" rx="6" ry="12" fill="#FFB3D9"/>
  <ellipse cx="90" cy="62" rx="6" ry="12" fill="#FFB3D9"/>
  <!-- Coin slot (line) -->
  <rect x="68" y="48" width="24" height="6" rx="2" fill="#C41E70"/>
  <!-- Eyes -->
  <circle cx="65" cy="80" r="5" fill="#333"/>
  <circle cx="85" cy="80" r="5" fill="#333"/>
  <circle cx="67" cy="78" r="2" fill="white"/>
  <circle cx="87" cy="78" r="2" fill="white"/>
  <!-- Nostrils on snout -->
  <circle cx="37" cy="92" r="2" fill="#C41E70"/>
  <circle cx="43" cy="92" r="2" fill="#C41E70"/>
  <!-- Front legs -->
  <rect x="50" y="135" width="10" height="20" rx="3" fill="#FF8FB3"/>
  <rect x="100" y="135" width="10" height="20" rx="3" fill="#FF8FB3"/>
  <!-- Back legs -->
  <rect x="60" y="140" width="8" height="15" rx="3" fill="#FF8FB3"/>
  <rect x="92" y="140" width="8" height="15" rx="3" fill="#FF8FB3"/>
  <!-- Tail (curly) -->
  <path d="M120,95 Q140,85 145,105" stroke="#FF8FB3" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Belly lighter shade -->
  <ellipse cx="75" cy="110" rx="35" ry="28" fill="#FFB3D9" opacity="0.6"/>
  <!-- Shine -->
  <ellipse cx="55" cy="70" rx="18" ry="20" fill="white" opacity="0.25"/>
</svg>
