<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Document background -->
  <rect x="25" y="20" width="110" height="120" rx="4" fill="#FFF3B0"/>
  <!-- Document border -->
  <rect x="25" y="20" width="110" height="120" rx="4" fill="none" stroke="#FFD166" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="25" y="20" width="110" height="20" rx="3" fill="#FFD166"/>
  <!-- Title -->
  <text x="80" y="35" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" font-family="Arial">LOAN AGREEMENT</text>
  <!-- Content lines -->
  <line x1="35" y1="50" x2="115" y2="50" stroke="#333" stroke-width="1"/>
  <line x1="35" y1="60" x2="115" y2="60" stroke="#333" stroke-width="1"/>
  <line x1="35" y1="70" x2="100" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="35" y1="80" x2="115" y2="80" stroke="#333" stroke-width="1"/>
  <line x1="35" y1="90" x2="105" y2="90" stroke="#333" stroke-width="1"/>
  <!-- Signature line -->
  <line x1="35" y1="110" x2="75" y2="110" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="125" font-size="8" fill="#666" font-family="Arial">Signature</text>
  <!-- Amount box -->
  <rect x="100" y="75" width="25" height="25" rx="2" fill="#E74C3C"/>
  <text x="112" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial">$</text>
  <!-- Stamp "APPROVED" -->
  <g transform="translate(105, 130) rotate(-15)">
    <rect x="0" y="0" width="35" height="15" fill="none" stroke="#27AE60" stroke-width="1.5" opacity="0.7"/>
    <text x="17" y="11" text-anchor="middle" font-size="8" font-weight="bold" fill="#27AE60" font-family="Arial">APPROVED</text>
  </g>
</svg>
