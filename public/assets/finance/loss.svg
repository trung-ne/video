<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Circle background -->
  <circle cx="80" cy="80" r="65" fill="#FFF5F5"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#E74C3C" stroke-width="3"/>
  <!-- Dollar sign (faded, indicating loss) -->
  <text x="80" y="65" text-anchor="middle" font-size="48" font-weight="900" fill="#E74C3C" font-family="Arial" opacity="0.8">$</text>
  <!-- Down arrow (loss indicator) -->
  <polygon points="80,100 68,115 92,115" fill="#E74C3C"/>
  <rect x="76" y="75" width="8" height="25" fill="#E74C3C"/>
  <!-- Loss percentage -->
  <text x="80" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#E74C3C" font-family="Arial">-18%</text>
  <!-- Falling coins (showing loss) -->
  <circle cx="40" cy="100" r="7" fill="#FFD700" opacity="0.5"/>
  <text x="40" y="104" text-anchor="middle" font-size="9" font-weight="bold" fill="#8B6914" opacity="0.6" font-family="Arial">$</text>
  <circle cx="120" cy="110" r="6" fill="#FFD700" opacity="0.4"/>
  <text x="120" y="113" text-anchor="middle" font-size="8" font-weight="bold" fill="#8B6914" opacity="0.5" font-family="Arial">$</text>
  <!-- Warning indicator -->
  <circle cx="130" cy="50" r="5" fill="#FF6B6B"/>
  <text x="130" y="53" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial">!</text>
</svg>
