<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Retirement timeline -->
  <!-- Age 25 (start) -->
  <circle cx="20" cy="90" r="8" fill="#3498DB"/>
  <text x="20" y="110" text-anchor="middle" font-size="8" fill="#666" font-family="Arial">Age 25</text>
  <line x1="28" y1="90" x2="52" y2="90" stroke="#3498DB" stroke-width="2"/>
  <!-- Age 45 (milestone) -->
  <circle cx="60" cy="90" r="8" fill="#3498DB"/>
  <text x="60" y="110" text-anchor="middle" font-size="8" fill="#666" font-family="Arial">Age 45</text>
  <line x1="68" y1="90" x2="92" y2="90" stroke="#3498DB" stroke-width="2"/>
  <!-- Age 65 (retirement) -->
  <circle cx="130" cy="90" r="8" fill="#FFD700" stroke="#FFC107" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" font-size="8" font-weight="bold" fill="#F39C12" font-family="Arial">Age 65</text>
  <!-- Savings growth above timeline -->
  <!-- Bar 1 -->
  <rect x="10" y="55" width="20" height="25" rx="2" fill="#3498DB" opacity="0.6"/>
  <text x="20" y="68" text-anchor="middle" font-size="7" fill="white" font-family="Arial">$50k</text>
  <!-- Bar 2 -->
  <rect x="50" y="35" width="20" height="45" rx="2" fill="#3498DB" opacity="0.8"/>
  <text x="60" y="60" text-anchor="middle" font-size="7" fill="white" font-family="Arial">$350k</text>
  <!-- Bar 3 (retirement savings) -->
  <rect x="115" y="10" width="30" height="70" rx="2" fill="#FFD700"/>
  <text x="130" y="48" text-anchor="middle" font-size="9" font-weight="bold" fill="#8B6914" font-family="Arial">$1.5M</text>
  <!-- Retirement icon (person relaxing) -->
  <circle cx="40" cy="140" r="6" fill="#2ECC71"/>
  <text x="40" y="145" text-anchor="middle" font-size="10" fill="white" font-family="Arial">✓</text>
  <text x="40" y="156" text-anchor="middle" font-size="8" fill="#27AE60" font-weight="bold" font-family="Arial">Ready</text>
</svg>
