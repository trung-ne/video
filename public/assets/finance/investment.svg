<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Chart background -->
  <rect x="15" y="20" width="130" height="100" rx="6" fill="#F0F4FF"/>
  <!-- Grid lines -->
  <line x1="15" y1="70" x2="145" y2="70" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="15" y1="45" x2="145" y2="45" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Bars chart -->
  <rect x="30" y="95" width="18" height="20" rx="2" fill="#3498DB" opacity="0.6"/>
  <rect x="55" y="80" width="18" height="35" rx="2" fill="#3498DB" opacity="0.8"/>
  <rect x="80" y="50" width="18" height="65" rx="2" fill="#3498DB"/>
  <rect x="105" y="35" width="18" height="80" rx="2" fill="#2980B9"/>
  <!-- Growth trend line -->
  <polyline points="39,90 64,70 89,45 114,28" stroke="#E74C3C" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <!-- Portfolio icon (circles representing different investments) -->
  <circle cx="25" cy="135" r="6" fill="#4CAF50"/>
  <circle cx="45" cy="140" r="6" fill="#FF9800"/>
  <circle cx="65" cy="138" r="6" fill="#9C27B0"/>
  <!-- ROI badge -->
  <rect x="105" y="125" width="35" height="25" rx="3" fill="#27AE60"/>
  <text x="122" y="138" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="Arial">ROI</text>
  <text x="122" y="148" text-anchor="middle" font-size="8" fill="white" font-family="Arial">+24%</text>
  <!-- Y-axis label -->
  <text x="10" y="80" font-size="7" fill="#666" font-family="Arial">$</text>
  <!-- X-axis label -->
  <text x="80" y="155" text-anchor="middle" font-size="7" fill="#666" font-family="Arial">Time</text>
</svg>
