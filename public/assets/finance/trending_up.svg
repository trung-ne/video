<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Background -->
  <rect x="15" y="15" width="130" height="130" rx="8" fill="#E8F8F5"/>
  <!-- Trend line chart -->
  <polyline points="30,120 50,100 70,110 90,60 110,40 130,30" stroke="#27AE60" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Area under line (fill) -->
  <polygon points="30,120 50,100 70,110 90,60 110,40 130,30 130,130 30,130" fill="#27AE60" opacity="0.15"/>
  <!-- Data points (circles on line) -->
  <circle cx="30" cy="120" r="4" fill="#27AE60"/>
  <circle cx="50" cy="100" r="4" fill="#27AE60"/>
  <circle cx="70" cy="110" r="4" fill="#27AE60"/>
  <circle cx="90" cy="60" r="4" fill="#27AE60"/>
  <circle cx="110" cy="40" r="4" fill="#27AE60"/>
  <circle cx="130" cy="30" r="5" fill="#27AE60" stroke="white" stroke-width="2"/>
  <!-- Up arrow at end -->
  <polygon points="130,25 122,40 138,40" fill="#27AE60"/>
  <!-- Grid lines (faint) -->
  <line x1="15" y1="85" x2="145" y2="85" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="15" y1="55" x2="145" y2="55" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Percentage label -->
  <text x="130" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#27AE60" font-family="Arial">+45%</text>
</svg>
