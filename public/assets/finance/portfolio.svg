<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Main briefcase/portfolio -->
  <rect x="25" y="50" width="110" height="85" rx="6" fill="#9B59B6"/>
  <!-- Top handle -->
  <path d="M 50 50 Q 80 20 110 50" stroke="#9B59B6" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Briefcase front plate -->
  <rect x="30" y="60" width="100" height="70" rx="4" fill="#B47FD1"/>
  <!-- Lock -->
  <rect x="75" y="65" width="10" height="10" fill="none" stroke="#6C3483" stroke-width="1.5" rx="2"/>
  <circle cx="80" cy="75" r="1.5" fill="#6C3483"/>
  <!-- Portfolio contents (asset icons inside) -->
  <!-- Stocks section -->
  <rect x="35" y="75" width="20" height="20" rx="2" fill="#FF6B6B" opacity="0.8"/>
  <polyline points="37,88 42,80 47,85 52,75" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="45" y="100" text-anchor="middle" font-size="7" fill="white" font-weight="bold" font-family="Arial">Stocks</text>
  <!-- Bonds section -->
  <rect x="60" y="75" width="20" height="20" rx="2" fill="#3498DB" opacity="0.8"/>
  <text x="70" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial">B</text>
  <text x="70" y="100" text-anchor="middle" font-size="7" fill="white" font-weight="bold" font-family="Arial">Bonds</text>
  <!-- Real Estate section -->
  <rect x="85" y="75" width="20" height="20" rx="2" fill="#2ECC71" opacity="0.8"/>
  <polygon points="90,85 92,79 94,85 97,85 93,88 95,94 90,90 85,94 87,88 83,85" fill="white"/>
  <text x="95" y="100" text-anchor="middle" font-size="7" fill="white" font-weight="bold" font-family="Arial">Real Est</text>
  <!-- Total portfolio value -->
  <rect x="35" y="108" width="90" height="30" rx="4" fill="#6C3483"/>
  <text x="80" y="120" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="Arial">Total Portfolio</text>
  <text x="80" y="135" text-anchor="middle" font-size="13" font-weight="900" fill="#FFD700" font-family="Arial">$500k</text>
</svg>
