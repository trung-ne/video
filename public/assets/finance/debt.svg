<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Chain links (representing debt chains) -->
  <!-- Link 1 -->
  <rect x="30" y="45" width="20" height="20" rx="3" fill="none" stroke="#C0392B" stroke-width="3"/>
  <circle cx="45" cy="50" r="2" fill="#C0392B"/>
  <line x1="50" y1="55" x2="60" y2="55" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Link 2 -->
  <rect x="60" y="45" width="20" height="20" rx="3" fill="none" stroke="#C0392B" stroke-width="3"/>
  <circle cx="75" cy="50" r="2" fill="#C0392B"/>
  <line x1="80" y1="55" x2="90" y2="55" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Link 3 -->
  <rect x="90" y="45" width="20" height="20" rx="3" fill="none" stroke="#C0392B" stroke-width="3"/>
  <circle cx="105" cy="50" r="2" fill="#C0392B"/>
  <!-- Hand being pulled down (stuck in debt) -->
  <circle cx="75" cy="100" r="18" fill="#F4A460"/>
  <line x1="60" y1="118" x2="50" y2="138" stroke="#F4A460" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="118" x2="100" y2="138" stroke="#F4A460" stroke-width="6" stroke-linecap="round"/>
  <line x1="75" y1="118" x2="75" y2="140" stroke="#F4A460" stroke-width="6" stroke-linecap="round"/>
  <!-- Downward arrow (debt pulling down) -->
  <line x1="75" y1="65" x2="75" y2="75" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <polygon points="75,80 68,70 82,70" fill="#E74C3C"/>
  <!-- Debt amount label -->
  <rect x="55" y="125" width="40" height="20" rx="4" fill="#E74C3C"/>
  <text x="75" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">$50k DEBT</text>
</svg>
