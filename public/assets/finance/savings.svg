<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Piggy bank body -->
  <ellipse cx="80" cy="95" rx="45" ry="40" fill="#FF6B9D"/>
  <!-- Snout -->
  <circle cx="48" cy="90" r="12" fill="#FF6B9D"/>
  <!-- Ears -->
  <ellipse cx="65" cy="55" rx="10" ry="18" fill="#FF6B9D"/>
  <ellipse cx="95" cy="55" rx="10" ry="18" fill="#FF6B9D"/>
  <!-- Coin slot -->
  <rect x="70" y="50" width="20" height="8" rx="2" fill="#2D3FBF"/>
  <!-- Eyes -->
  <circle cx="70" cy="80" r="4" fill="#333"/>
  <circle cx="90" cy="80" r="4" fill="#333"/>
  <!-- Snout detail -->
  <circle cx="48" cy="90" r="12" fill="none" stroke="#FF5983" stroke-width="2"/>
  <!-- Legs -->
  <rect x="55" y="125" width="8" height="18" rx="2" fill="#FF6B9D"/>
  <rect x="75" y="128" width="8" height="15" rx="2" fill="#FF6B9D"/>
  <rect x="97" y="125" width="8" height="18" rx="2" fill="#FF6B9D"/>
  <!-- Tail -->
  <path d="M115,85 Q135,80 140,100" stroke="#FF6B9D" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Highlight -->
  <ellipse cx="65" cy="70" rx="12" ry="15" fill="white" opacity="0.25"/>
  <!-- Coins inside (visible through body) -->
  <circle cx="70" cy="105" r="6" fill="#FFD700" opacity="0.4"/>
  <circle cx="90" cy="100" r="5" fill="#FFD700" opacity="0.3"/>
</svg>
