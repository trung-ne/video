<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Bitcoin-style coin (crypto symbol) -->
  <circle cx="80" cy="75" r="40" fill="#F7931A"/>
  <circle cx="80" cy="75" r="35" fill="#F39C12"/>
  <!-- Bitcoin symbol B -->
  <text x="80" y="75" text-anchor="middle" font-size="38" font-weight="900" fill="white" font-family="Arial">₿</text>
  <!-- Network nodes (blockchain visualization) -->
  <!-- Top node -->
  <circle cx="45" cy="35" r="7" fill="#3498DB"/>
  <!-- Left node -->
  <circle cx="25" cy="75" r="7" fill="#3498DB"/>
  <!-- Right node -->
  <circle cx="135" cy="75" r="7" fill="#3498DB"/>
  <!-- Bottom node -->
  <circle cx="80" cy="140" r="7" fill="#3498DB"/>
  <!-- Connecting lines (blockchain) -->
  <line x1="55" y1="45" x2="75" y2="65" stroke="#3498DB" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="32" y1="75" x2="73" y2="75" stroke="#3498DB" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="87" y1="75" x2="128" y2="75" stroke="#3498DB" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="75" y1="110" x2="80" y2="133" stroke="#3498DB" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Volatility indicator (wavy line) -->
  <polyline points="20,155 30,145 40,155 50,145 60,155 70,145 80,155" stroke="#E74C3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="100" y="160" font-size="8" fill="#E74C3C" font-weight="bold" font-family="Arial">Volatile</text>
</svg>
