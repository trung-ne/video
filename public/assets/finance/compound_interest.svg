<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Growing stack of coins -->
  <!-- Bottom layer (year 1) -->
  <ellipse cx="80" cy="125" rx="50" ry="15" fill="#FFD700"/>
  <rect x="30" y="125" width="100" height="12" fill="#FFC107"/>
  <text x="80" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#8B6914" font-family="Arial">$1000</text>
  <!-- Layer 2 (year 2) -->
  <ellipse cx="80" cy="105" rx="44" ry="13" fill="#FFD700"/>
  <rect x="36" y="105" width="88" height="10" fill="#FFC107"/>
  <text x="80" y="109" text-anchor="middle" font-size="8" font-weight="bold" fill="#8B6914" font-family="Arial">$1050</text>
  <!-- Layer 3 (year 3) -->
  <ellipse cx="80" cy="88" rx="38" ry="11" fill="#FFD700"/>
  <rect x="42" y="88" width="76" height="9" fill="#FFC107"/>
  <text x="80" y="91" text-anchor="middle" font-size="7" font-weight="bold" fill="#8B6914" font-family="Arial">$1103</text>
  <!-- Layer 4 (year 4) -->
  <ellipse cx="80" cy="72" rx="32" ry="9" fill="#FFD700"/>
  <rect x="48" y="72" width="64" height="7" fill="#FFC107"/>
  <text x="80" y="74" text-anchor="middle" font-size="6" font-weight="bold" fill="#8B6914" font-family="Arial">$1159</text>
  <!-- Layer 5 (year 5) -->
  <ellipse cx="80" cy="58" rx="26" ry="7" fill="#FFD700"/>
  <rect x="54" y="58" width="52" height="6" fill="#FFC107"/>
  <!-- Upward arrow showing growth -->
  <line x1="120" y1="130" x2="120" y2="50" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  <polygon points="120,45 115,55 125,55" fill="#2ECC71"/>
  <!-- Percentage growth label -->
  <text x="135" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#2ECC71" font-family="Arial">+5%/yr</text>
</svg>
