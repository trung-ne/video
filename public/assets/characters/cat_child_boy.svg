<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Cat child boy - red t-shirt, blue cap, rosy cheeks -->
  <!-- Body -->
  <ellipse cx="80" cy="108" rx="30" ry="33" fill="#E74C3C" stroke="#1a1a1a" stroke-width="3"/>
  <!-- T-shirt text hint -->
  <text x="80" y="112" font-family="Arial" font-size="9" fill="white" text-anchor="middle" font-weight="bold">เด็กดี</text>
  <!-- Head -->
  <ellipse cx="80" cy="62" rx="28" ry="24" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="58,46 52,30 70,42" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="102,46 108,30 90,42" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Blue cap -->
  <ellipse cx="80" cy="50" rx="28" ry="10" fill="#3498DB" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="54" y="40" width="52" height="14" rx="7" fill="#2980B9" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Cap brim -->
  <path d="M52,50 Q44,52 48,56" stroke="#1a1a1a" stroke-width="2" fill="#2980B9"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="68" rx="16" ry="13" fill="#F5F0E8"/>
  <!-- Eyes -->
  <circle cx="73" cy="62" r="2.5" fill="#1a1a1a"/>
  <circle cx="87" cy="62" r="2.5" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M78,67 L80,69 L82,67" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Rosy cheeks -->
  <ellipse cx="66" cy="70" rx="7" ry="5" fill="#FF9BAA" opacity="0.6"/>
  <ellipse cx="94" cy="70" rx="7" ry="5" fill="#FF9BAA" opacity="0.6"/>
  <!-- Mouth smile -->
  <path d="M76,72 Q80,76 84,72" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Legs -->
  <rect x="65" y="140" width="9" height="16" rx="3" fill="#1a1a1a"/>
  <rect x="86" y="140" width="9" height="16" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M52,95 Q44,108 50,120" stroke="#9B59B6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M108,95 Q116,108 110,120" stroke="#9B59B6" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
