<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Cat child in school uniform - white shirt, dark skirt, rosy cheeks, black hair -->
  <!-- Body - school shirt white -->
  <ellipse cx="80" cy="105" rx="30" ry="35" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Shirt collar -->
  <path d="M68,82 L80,92 L92,82" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Dark skirt/shorts -->
  <rect x="55" y="128" width="50" height="18" rx="4" fill="#2C3E7A" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Head -->
  <ellipse cx="80" cy="62" rx="28" ry="24" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="58,46 52,30 70,42" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="102,46 108,30 90,42" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Black hair / cap -->
  <ellipse cx="80" cy="48" rx="26" ry="10" fill="#1a1a1a"/>
  <rect x="54" y="44" width="52" height="10" rx="5" fill="#1a1a1a"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="68" rx="16" ry="13" fill="#F5F0E8"/>
  <!-- Eyes -->
  <circle cx="73" cy="62" r="2.5" fill="#1a1a1a"/>
  <circle cx="87" cy="62" r="2.5" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M78,67 L80,69 L82,67" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Rosy cheeks -->
  <ellipse cx="66" cy="70" rx="7" ry="5" fill="#FF9BAA" opacity="0.6"/>
  <ellipse cx="94" cy="70" rx="7" ry="5" fill="#FF9BAA" opacity="0.6"/>
  <!-- Mouth smile -->
  <path d="M76,72 Q80,76 84,72" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Legs -->
  <rect x="66" y="146" width="8" height="14" rx="3" fill="#1a1a1a"/>
  <rect x="86" y="146" width="8" height="14" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M52,90 Q44,100 48,112" stroke="#9B59B6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M108,90 Q116,100 112,112" stroke="#9B59B6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Backpack strap hint -->
  <path d="M92,83 Q105,100 100,128" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
