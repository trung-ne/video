<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Cat with sunglasses - boss/confident look, gray business suit -->
  <!-- Body - gray suit -->
  <ellipse cx="80" cy="108" rx="32" ry="36" fill="#5D6D7E" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Shirt/lapels white -->
  <path d="M70,80 L80,95 L90,80" fill="#ECF0F1" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Red tie -->
  <polygon points="80,88 76,118 80,126 84,118" fill="#E74C3C" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Pen/pointer in hand -->
  <line x1="112" y1="110" x2="130" y2="96" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="95" r="4" fill="#2C3E50"/>
  <!-- Head -->
  <ellipse cx="80" cy="60" rx="29" ry="25" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="57,44 51,28 72,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="103,44 109,28 88,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="66" rx="17" ry="14" fill="#F5F0E8"/>
  <!-- Sunglasses - cool dark shades -->
  <rect x="64" y="56" width="17" height="12" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="83" y="56" width="17" height="12" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="81" y1="62" x2="83" y2="62" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="64" y1="62" x2="60" y2="60" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="100" y1="62" x2="104" y2="60" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Shine on glasses -->
  <path d="M67,58 Q70,57 72,59" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M86,58 Q89,57 91,59" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Nose -->
  <path d="M78,70 L80,73 L82,70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Mouth confident/slight smirk -->
  <path d="M77,75 Q83,78 86,75" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Legs -->
  <rect x="64" y="142" width="10" height="16" rx="3" fill="#1a1a1a"/>
  <rect x="86" y="142" width="10" height="16" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M50,96 Q42,112 48,126" stroke="#5D6D7E" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M110,96 Q120,108 118,120" stroke="#5D6D7E" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
