<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Cat in police/security uniform - dark navy, cap with badge -->
  <!-- Body - navy uniform -->
  <ellipse cx="80" cy="108" rx="32" ry="36" fill="#1A252F" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Uniform details - buttons -->
  <circle cx="80" cy="92" r="2.5" fill="#BDC3C7"/>
  <circle cx="80" cy="102" r="2.5" fill="#BDC3C7"/>
  <circle cx="80" cy="112" r="2.5" fill="#BDC3C7"/>
  <!-- Chest pockets -->
  <rect x="58" y="92" width="14" height="10" rx="2" fill="#17202A" stroke="#BDC3C7" stroke-width="1"/>
  <rect x="88" y="92" width="14" height="10" rx="2" fill="#17202A" stroke="#BDC3C7" stroke-width="1"/>
  <!-- Shoulder stripes -->
  <rect x="50" y="84" width="12" height="5" rx="2" fill="#BDC3C7"/>
  <rect x="98" y="84" width="12" height="5" rx="2" fill="#BDC3C7"/>
  <!-- Head -->
  <ellipse cx="80" cy="60" rx="28" ry="25" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears (under cap) -->
  <polygon points="60,46 54,30 72,44" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="100,46 106,30 88,44" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Police cap -->
  <ellipse cx="80" cy="46" rx="30" ry="10" fill="#1A252F" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="52" y="36" width="56" height="14" rx="6" fill="#1A252F" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Cap brim -->
  <rect x="50" y="48" width="60" height="6" rx="3" fill="#17202A" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Badge on cap -->
  <polygon points="80,38 83,44 89,44 84,48 86,54 80,50 74,54 76,48 71,44 77,44" fill="#F1C40F" stroke="#1a1a1a" stroke-width="1"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="66" rx="17" ry="14" fill="#F5F0E8"/>
  <!-- Eyes - stern -->
  <path d="M70,59 L76,61" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M84,61 L90,59" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="73" cy="62" r="2" fill="#1a1a1a"/>
  <circle cx="87" cy="62" r="2" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M78,67 L80,69 L82,67" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Mouth stern -->
  <path d="M76,72 L84,72" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Legs -->
  <rect x="64" y="142" width="10" height="16" rx="3" fill="#1a1a1a"/>
  <rect x="86" y="142" width="10" height="16" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M50,96 Q42,112 50,126" stroke="#1A252F" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M110,96 Q118,112 110,126" stroke="#1A252F" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
