<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Mom cat - red dress, blonde hair, rosy cheeks -->
  <!-- Body - red dress -->
  <ellipse cx="80" cy="110" rx="34" ry="36" fill="#E74C3C" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Dress neckline V -->
  <path d="M68,80 L80,96 L92,80" fill="#C0392B" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="80" cy="60" rx="30" ry="26" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="56,44 50,27 72,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="104,44 110,27 88,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Blonde hair long -->
  <ellipse cx="80" cy="46" rx="32" ry="12" fill="#F1C40F" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M50,48 Q40,72 44,100" stroke="#F1C40F" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M110,48 Q120,72 116,100" stroke="#F1C40F" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="68" rx="18" ry="15" fill="#F5F0E8"/>
  <!-- Eyes - annoyed/dramatic (eyelash lines) -->
  <circle cx="73" cy="62" r="3" fill="#1a1a1a"/>
  <circle cx="87" cy="62" r="3" fill="#1a1a1a"/>
  <!-- Eyelashes -->
  <path d="M70,59 L67,56 M73,58 L72,54 M76,59 L79,56" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M90,59 L87,56 M87,58 L88,54 M84,59 L81,56" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Nose -->
  <path d="M78,68 L80,71 L82,68" fill="#E74C3C" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Rosy cheeks -->
  <ellipse cx="64" cy="72" rx="8" ry="6" fill="#FF6B9D" opacity="0.5"/>
  <ellipse cx="96" cy="72" rx="8" ry="6" fill="#FF6B9D" opacity="0.5"/>
  <!-- Mouth open/dramatic -->
  <path d="M74,74 Q80,80 86,74" fill="#E74C3C" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Legs -->
  <rect x="65" y="144" width="10" height="14" rx="3" fill="#1a1a1a"/>
  <rect x="85" y="144" width="10" height="14" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M48,96 Q38,112 42,128" stroke="#9B59B6" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M112,96 Q122,112 118,128" stroke="#9B59B6" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
