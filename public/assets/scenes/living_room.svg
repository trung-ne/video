<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Flat-vector living room stage. Anchors: sofa_left / sofa_right on the couch. -->
  <!-- wall -->
  <rect width="1920" height="1080" fill="#EAF2E3"/>
  <rect width="1920" height="70" fill="#DCE8D2"/>
  <!-- floor -->
  <rect y="800" width="1920" height="280" fill="#C9A27D"/>
  <rect y="800" width="1920" height="14" fill="#B78E68"/>
  <!-- window -->
  <g>
    <rect x="180" y="160" width="360" height="300" rx="16" fill="#BFE3F2"/>
    <rect x="180" y="160" width="360" height="300" rx="16" fill="none" stroke="#7C6A55" stroke-width="16"/>
    <line x1="360" y1="160" x2="360" y2="460" stroke="#7C6A55" stroke-width="10"/>
    <ellipse cx="300" cy="250" rx="46" ry="18" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <!-- framed pictures -->
  <g>
    <rect x="850" y="170" width="150" height="120" rx="8" fill="#FFF6EC" stroke="#7C6A55" stroke-width="9"/>
    <circle cx="925" cy="230" r="34" fill="#F2B366"/>
    <rect x="1040" y="200" width="120" height="150" rx="8" fill="#FFF6EC" stroke="#7C6A55" stroke-width="9"/>
    <path d="M1055 330 L1100 270 L1145 330 Z" fill="#7FB77E"/>
  </g>
  <!-- plant -->
  <g>
    <rect x="1660" y="640" width="120" height="120" rx="14" fill="#C96A48"/>
    <path d="M1720 640 C1660 560 1660 500 1700 440 C1716 500 1716 540 1720 640 Z" fill="#5E9B5E"/>
    <path d="M1720 640 C1780 560 1786 500 1750 450 C1730 510 1726 550 1720 640 Z" fill="#6FAF6F"/>
    <path d="M1720 640 C1700 560 1730 480 1720 430 C1750 490 1740 560 1720 640 Z" fill="#7FC17F"/>
  </g>
  <!-- rug -->
  <ellipse cx="960" cy="980" rx="480" ry="72" fill="#D8C7EA" opacity="0.8"/>
  <!-- sofa -->
  <g>
    <!-- back -->
    <rect x="600" y="520" width="720" height="230" rx="46" fill="#E2874F"/>
    <!-- seat cushions -->
    <rect x="620" y="690" width="330" height="110" rx="26" fill="#EF9C63"/>
    <rect x="970" y="690" width="330" height="110" rx="26" fill="#EF9C63"/>
    <!-- armrests -->
    <rect x="540" y="600" width="120" height="220" rx="40" fill="#D97B41"/>
    <rect x="1260" y="600" width="120" height="220" rx="40" fill="#D97B41"/>
    <!-- base + legs -->
    <rect x="580" y="790" width="760" height="46" rx="18" fill="#C96A34"/>
    <rect x="620" y="836" width="30" height="40" rx="8" fill="#8A5A3B"/>
    <rect x="1270" y="836" width="30" height="40" rx="8" fill="#8A5A3B"/>
  </g>
  <!-- side table with mug -->
  <g>
    <rect x="380" y="700" width="140" height="16" rx="8" fill="#8A5A3B"/>
    <rect x="436" y="716" width="24" height="120" fill="#6E4A2E"/>
    <rect x="410" y="660" width="52" height="42" rx="8" fill="#E5626B"/>
    <path d="M462 672 a16 16 0 1 1 0 22" fill="none" stroke="#E5626B" stroke-width="8"/>
  </g>
</svg>
