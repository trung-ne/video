<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-chart-up" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#52C41A;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#52C41A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-chart-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#52C41A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13C2C2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Grid background (subtle) -->
  <line x1="50" y1="100" x2="130" y2="100" stroke="#E8E8E8" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="80" x2="130" y2="80" stroke="#E8E8E8" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="60" x2="130" y2="60" stroke="#E8E8E8" stroke-width="1" opacity="0.3"/>

  <!-- Y-axis -->
  <line x1="50" y1="50" x2="50" y2="105" stroke="#595959" stroke-width="1.5"/>
  <!-- X-axis -->
  <line x1="50" y1="105" x2="135" y2="105" stroke="#595959" stroke-width="1.5"/>

  <!-- Area fill under curve -->
  <path d="M 50 105 L 70 85 L 90 75 L 110 60 L 130 50 L 130 105 Z" fill="url(#grad-chart-up)" opacity="0.5"/>

  <!-- Line chart -->
  <polyline points="50,105 70,85 90,75 110,60 130,50"
            fill="none"
            stroke="url(#grad-chart-line)"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="50" cy="105" r="2" fill="#52C41A" opacity="0.8"/>
  <circle cx="70" cy="85" r="2" fill="#52C41A" opacity="0.8"/>
  <circle cx="90" cy="75" r="2" fill="#52C41A" opacity="0.8"/>
  <circle cx="110" cy="60" r="2" fill="#13C2C2" opacity="0.8"/>
  <circle cx="130" cy="50" r="2.5" fill="#13C2C2" opacity="0.9"/>

  <!-- Up arrow indicator -->
  <path d="M 130 35 L 130 25 M 130 25 L 125 30 M 130 25 L 135 30"
        stroke="#52C41A"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>