<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Calendar -->
  <!-- Body -->
  <rect x="15" y="30" width="130" height="118" rx="8" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Header red -->
  <rect x="15" y="30" width="130" height="36" rx="8" fill="#E74C3C" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="15" y="50" width="130" height="16" fill="#E74C3C"/>
  <!-- Rings -->
  <circle cx="52" cy="32" r="7" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="52" cy="32" r="4" fill="#C0392B"/>
  <circle cx="108" cy="32" r="7" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="108" cy="32" r="4" fill="#C0392B"/>
  <!-- Month text -->
  <text x="80" y="56" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">THÁNG 1</text>
  <!-- Day headers -->
  <text x="28" y="82" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle" font-weight="bold">CN</text>
  <text x="47" y="82" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">T2</text>
  <text x="66" y="82" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">T3</text>
  <text x="85" y="82" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">T4</text>
  <text x="104" y="82" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">T5</text>
  <text x="123" y="82" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">T6</text>
  <text x="142" y="82" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">T7</text>
  <!-- Days grid -->
  <text x="85" y="102" font-family="Arial" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">15</text>
  <!-- Circle highlight -->
  <circle cx="85" cy="97" r="14" fill="none" stroke="#E74C3C" stroke-width="2"/>
  <!-- Other day numbers simplified -->
  <text x="66" y="102" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">14</text>
  <text x="104" y="102" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">16</text>
  <text x="47" y="102" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">13</text>
  <text x="123" y="102" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">17</text>
  <text x="28" y="120" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">18</text>
  <text x="47" y="120" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">20</text>
  <text x="66" y="120" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">21</text>
  <text x="85" y="120" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">22</text>
  <text x="104" y="120" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">23</text>
  <text x="123" y="120" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">24</text>
  <text x="142" y="120" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">25</text>
