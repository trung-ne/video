<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Dinner table viewed from slight angle -->
  <!-- Table surface -->
  <ellipse cx="160" cy="50" rx="148" ry="40" fill="#8B4513" stroke="#5C2E00" stroke-width="3"/>
  <!-- Table cloth pattern hint -->
  <ellipse cx="160" cy="46" rx="140" ry="35" fill="#A0522D" stroke="none"/>
  <!-- Rice bowl left -->
  <ellipse cx="68" cy="44" rx="24" ry="10" fill="white" stroke="#CCC" stroke-width="2"/>
  <ellipse cx="68" cy="40" rx="22" ry="7" fill="white" stroke="#DDD" stroke-width="1.5"/>
  <ellipse cx="68" cy="38" rx="18" ry="5" fill="#F5F5DC"/>
  <!-- Rice bowl middle -->
  <ellipse cx="160" cy="44" rx="24" ry="10" fill="white" stroke="#CCC" stroke-width="2"/>
  <ellipse cx="160" cy="40" rx="22" ry="7" fill="white" stroke="#DDD" stroke-width="1.5"/>
  <ellipse cx="160" cy="38" rx="18" ry="5" fill="#F5F5DC"/>
  <!-- Rice bowl right -->
  <ellipse cx="252" cy="44" rx="24" ry="10" fill="white" stroke="#CCC" stroke-width="2"/>
  <ellipse cx="252" cy="40" rx="22" ry="7" fill="white" stroke="#DDD" stroke-width="1.5"/>
  <ellipse cx="252" cy="38" rx="18" ry="5" fill="#F5F5DC"/>
  <!-- Chopsticks -->
  <line x1="56" y1="30" x2="60" y2="58" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="30" x2="66" y2="58" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Side dish plate -->
  <ellipse cx="110" cy="52" rx="20" ry="8" fill="#FFF8DC" stroke="#DDD" stroke-width="1.5"/>
  <!-- Table legs -->
  <rect x="30" y="82" width="12" height="36" rx="4" fill="#5C2E00"/>
  <rect x="278" y="82" width="12" height="36" rx="4" fill="#5C2E00"/>
</svg>
