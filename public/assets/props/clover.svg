<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- 4-leaf clover (luck) -->
  <!-- Stem -->
  <path d="M80,130 Q72,110 80,95" stroke="#27AE60" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Leaf top -->
  <ellipse cx="80" cy="72" rx="20" ry="24" fill="#2ECC71" stroke="#27AE60" stroke-width="2.5" transform="rotate(-10,80,72)"/>
  <!-- Leaf bottom -->
  <ellipse cx="80" cy="100" rx="20" ry="24" fill="#2ECC71" stroke="#27AE60" stroke-width="2.5" transform="rotate(10,80,100)"/>
  <!-- Leaf left -->
  <ellipse cx="56" cy="86" rx="24" ry="20" fill="#2ECC71" stroke="#27AE60" stroke-width="2.5" transform="rotate(-10,56,86)"/>
  <!-- Leaf right -->
  <ellipse cx="104" cy="86" rx="24" ry="20" fill="#2ECC71" stroke="#27AE60" stroke-width="2.5" transform="rotate(10,104,86)"/>
  <!-- Center -->
  <circle cx="80" cy="86" r="12" fill="#27AE60"/>
  <!-- Leaf highlights -->
  <path d="M74,70 Q80,65 85,70" stroke="#52D68A" stroke-width="2" fill="none"/>
  <path d="M52,83 Q56,78 62,82" stroke="#52D68A" stroke-width="2" fill="none"/>
  <path d="M98,83 Q102,78 108,82" stroke="#52D68A" stroke-width="2" fill="none"/>
</svg>
