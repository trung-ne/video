<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- Concept card frame - gray border, colored fill area inside (fill via CSS/props) -->
  <!-- Shadow -->
  <rect x="8" y="8" width="188" height="140" rx="14" fill="#00000030"/>
  <!-- Card border - dark gray hand-drawn style -->
  <rect x="4" y="4" width="188" height="138" rx="14" fill="#4A4A4A" stroke="#2A2A2A" stroke-width="3"/>
  <!-- Inner colored area (default pink - will be overridden per card) -->
  <rect x="10" y="10" width="176" height="126" rx="10" fill="#FFB3D1"/>
  <!-- Subtle gloss line -->
  <path d="M20,18 Q100,14 178,18" stroke="white" stroke-width="2" opacity="0.3" fill="none"/>
</svg>
