<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-bank-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0050B3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-bank-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9001B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Building base -->
  <rect x="40" y="50" width="80" height="65" rx="4" fill="url(#grad-bank-blue)" stroke="#003A8C" stroke-width="2" opacity="0.9"/>

  <!-- Roof/top accent -->
  <polygon points="40,50 80,35 120,50" fill="#003A8C" stroke="#001F4D" stroke-width="1.5" opacity="0.8"/>

  <!-- Door -->
  <rect x="65" y="85" width="30" height="30" rx="2" fill="#0050B3" stroke="#003A8C" stroke-width="1.5" opacity="0.95"/>
  <circle cx="92" cy="100" r="2" fill="white" opacity="0.6"/>

  <!-- Windows -->
  <g opacity="0.7">
    <rect x="50" y="60" width="12" height="12" rx="1" fill="white" stroke="#003A8C" stroke-width="1"/>
    <rect x="98" y="60" width="12" height="12" rx="1" fill="white" stroke="#003A8C" stroke-width="1"/>
  </g>

  <!-- Decorative accent line -->
  <rect x="40" y="75" width="80" height="2" fill="url(#grad-bank-accent)" opacity="0.6"/>

  <!-- Flag/banner -->
  <polygon points="120,45 120,38 130,41.5" fill="url(#grad-bank-accent)" opacity="0.8"/>
</svg>