<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Teacher cat - older, gray mustache, business suit, pointer -->
  <!-- Body - dark suit -->
  <ellipse cx="80" cy="108" rx="34" ry="38" fill="#2C3E50" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Shirt/lapels -->
  <path d="M68,78 L80,94 L92,78" fill="#ECF0F1" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Red tie -->
  <polygon points="80,90 76,122 80,130 84,122" fill="#E74C3C" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Head - larger, older -->
  <ellipse cx="80" cy="56" rx="31" ry="28" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="55,40 49,23 71,36" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="105,40 111,23 89,36" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="63" rx="19" ry="16" fill="#F5F0E8"/>
  <!-- Gray mustache -->
  <path d="M70,72 Q75,68 80,71 Q85,68 90,72" fill="#8D8D8D" stroke="#6D6D6D" stroke-width="1"/>
  <path d="M70,72 Q75,75 80,73 Q85,75 90,72" fill="#8D8D8D"/>
  <!-- Eyes - wise/narrowed -->
  <circle cx="73" cy="60" r="3" fill="#1a1a1a"/>
  <circle cx="87" cy="60" r="3" fill="#1a1a1a"/>
  <path d="M70,57 L76,59" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M84,59 L90,57" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Nose -->
  <path d="M78,67 L80,70 L82,67" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Legs -->
  <rect x="63" y="144" width="11" height="14" rx="3" fill="#1a1a1a"/>
  <rect x="86" y="144" width="11" height="14" rx="3" fill="#1a1a1a"/>
  <!-- Arms + pointer stick -->
  <path d="M50,94 Q40,112 44,130" stroke="#2C3E50" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M110,94 Q122,108 118,118 L140,80" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" fill="none"/>
  <line x1="118" y1="118" x2="142" y2="76" stroke="#8B6914" stroke-width="4" stroke-linecap="round"/>
  <circle cx="142" cy="75" r="4" fill="#E74C3C"/>
</svg>
