<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Dad cat - olive/brown jacket, glasses, authority figure -->
  <!-- Body - olive jacket -->
  <ellipse cx="80" cy="108" rx="33" ry="36" fill="#8B7355" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Shirt collar white -->
  <path d="M70,80 L80,92 L90,80" fill="#ECF0F1" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Dark tie -->
  <polygon points="80,88 77,115 80,122 83,115" fill="#2C3E50" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Head - slightly larger/older -->
  <ellipse cx="80" cy="58" rx="30" ry="26" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="56,42 50,26 72,38" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="104,42 110,26 88,38" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="65" rx="18" ry="15" fill="#F5F0E8"/>
  <!-- Glasses -->
  <rect x="66" y="57" width="14" height="10" rx="3" fill="none" stroke="#9B59B6" stroke-width="2.5"/>
  <rect x="84" y="57" width="14" height="10" rx="3" fill="none" stroke="#9B59B6" stroke-width="2.5"/>
  <line x1="80" y1="62" x2="84" y2="62" stroke="#9B59B6" stroke-width="2.5"/>
  <line x1="66" y1="62" x2="62" y2="62" stroke="#9B59B6" stroke-width="2.5"/>
  <line x1="98" y1="62" x2="102" y2="62" stroke="#9B59B6" stroke-width="2.5"/>
  <!-- Eyes behind glasses -->
  <circle cx="73" cy="62" r="2" fill="#1a1a1a"/>
  <circle cx="91" cy="62" r="2" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M78,68 L80,71 L82,68" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Mouth -->
  <path d="M75,74 Q80,77 85,74" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Legs -->
  <rect x="64" y="142" width="11" height="16" rx="3" fill="#1a1a1a"/>
  <rect x="85" y="142" width="11" height="16" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M49,96 Q40,114 46,128" stroke="#8B7355" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M111,96 Q120,114 114,128" stroke="#8B7355" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
