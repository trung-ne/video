<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Cat child girl - pink dress, blonde hair, flower -->
  <!-- Body - pink dress -->
  <ellipse cx="80" cy="108" rx="32" ry="35" fill="#DDA0DD" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Dress flare bottom -->
  <ellipse cx="80" cy="138" rx="35" ry="8" fill="#DDA0DD" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Flower on dress -->
  <circle cx="80" cy="112" r="5" fill="#27AE60"/>
  <circle cx="80" cy="107" r="4" fill="white" stroke="#27AE60" stroke-width="1"/>
  <circle cx="76" cy="111" r="4" fill="white" stroke="#27AE60" stroke-width="1"/>
  <circle cx="84" cy="111" r="4" fill="white" stroke="#27AE60" stroke-width="1"/>
  <circle cx="80" cy="113" r="3" fill="#F1C40F"/>
  <!-- Head -->
  <ellipse cx="80" cy="62" rx="28" ry="24" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="58,46 52,30 70,42" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="102,46 108,30 90,42" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Blonde hair -->
  <ellipse cx="80" cy="48" rx="30" ry="12" fill="#F1C40F" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M52,50 Q45,70 50,90" stroke="#F1C40F" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M108,50 Q115,70 110,90" stroke="#F1C40F" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="68" rx="16" ry="13" fill="#F5F0E8"/>
  <!-- Eyes -->
  <circle cx="73" cy="62" r="2.5" fill="#1a1a1a"/>
  <circle cx="87" cy="62" r="2.5" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M78,67 L80,69 L82,67" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Rosy cheeks -->
  <ellipse cx="66" cy="70" rx="7" ry="5" fill="#FF9BAA" opacity="0.7"/>
  <ellipse cx="94" cy="70" rx="7" ry="5" fill="#FF9BAA" opacity="0.7"/>
  <!-- Mouth smile -->
  <path d="M76,72 Q80,77 84,72" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Legs -->
  <rect x="66" y="148" width="8" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="86" y="148" width="8" height="12" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M50,96 Q42,108 46,120" stroke="#9B59B6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M110,96 Q118,108 114,120" stroke="#9B59B6" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
