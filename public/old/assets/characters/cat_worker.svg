<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Worker/blue-collar cat - blue shirt, casual -->
  <!-- Body -->
  <ellipse cx="80" cy="108" rx="31" ry="35" fill="#2980B9" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Shirt pocket -->
  <rect x="62" y="92" width="14" height="12" rx="2" fill="#1A6A99" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Head -->
  <ellipse cx="80" cy="60" rx="28" ry="25" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="58,44 52,28 72,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="102,44 108,28 88,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="66" rx="16" ry="14" fill="#F5F0E8"/>
  <!-- Eyes -->
  <circle cx="73" cy="61" r="2.5" fill="#1a1a1a"/>
  <circle cx="87" cy="61" r="2.5" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M78,66 L80,69 L82,66" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Mouth relaxed -->
  <path d="M76,72 Q80,75 84,72" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Legs -->
  <rect x="65" y="141" width="10" height="17" rx="3" fill="#1a1a1a"/>
  <rect x="85" y="141" width="10" height="17" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M51,96 Q42,112 46,128" stroke="#2980B9" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M109,96 Q118,112 114,128" stroke="#2980B9" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
