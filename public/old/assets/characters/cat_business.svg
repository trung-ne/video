<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Cat in business suit - gray suit, red tie, no sunglasses -->
  <!-- Body - gray suit -->
  <ellipse cx="80" cy="108" rx="32" ry="36" fill="#5D6D7E" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Suit lapels -->
  <path d="M70,80 L80,95 L90,80" fill="#ECF0F1" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Red tie -->
  <polygon points="80,88 76,120 80,128 84,120" fill="#E74C3C" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Suit buttons -->
  <circle cx="80" cy="108" r="2" fill="#4A5568"/>
  <circle cx="80" cy="118" r="2" fill="#4A5568"/>
  <!-- Pocket squares -->
  <rect x="58" y="95" width="10" height="7" rx="1" fill="#ECF0F1" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Head -->
  <ellipse cx="80" cy="60" rx="28" ry="25" fill="#9B59B6" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="58,44 52,28 70,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="102,44 108,28 90,40" fill="#9B59B6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- White face patch -->
  <ellipse cx="80" cy="66" rx="17" ry="14" fill="#F5F0E8"/>
  <!-- Eyes -->
  <circle cx="73" cy="60" r="2.8" fill="#1a1a1a"/>
  <circle cx="87" cy="60" r="2.8" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M78,66 L80,68 L82,66" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Mouth neutral/slight smile -->
  <path d="M76,71 Q80,74 84,71" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Legs -->
  <rect x="64" y="142" width="10" height="16" rx="3" fill="#1a1a1a"/>
  <rect x="86" y="142" width="10" height="16" rx="3" fill="#1a1a1a"/>
  <!-- Arms -->
  <path d="M50,96 Q42,112 48,126" stroke="#5D6D7E" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M110,96 Q118,112 112,126" stroke="#5D6D7E" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
