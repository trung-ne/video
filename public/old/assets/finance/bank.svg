<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Base -->
  <rect x="15" y="125" width="130" height="18" rx="4" fill="#5B8DD9"/>
  <!-- Steps -->
  <rect x="22" y="112" width="116" height="15" rx="2" fill="#6B9DE8"/>
  <!-- Columns -->
  <rect x="30" y="58" width="14" height="56" fill="#7BAFF0"/>
  <rect x="52" y="58" width="14" height="56" fill="#7BAFF0"/>
  <rect x="74" y="58" width="14" height="56" fill="#7BAFF0"/>
  <rect x="96" y="58" width="14" height="56" fill="#7BAFF0"/>
  <rect x="118" y="58" width="14" height="56" fill="#7BAFF0"/>
  <!-- Entablature -->
  <rect x="18" y="48" width="124" height="12" rx="2" fill="#5B8DD9"/>
  <!-- Pediment (triangle roof) -->
  <polygon points="80,10 15,50 145,50" fill="#4A7CC7"/>
  <!-- Dollar sign -->
  <text x="80" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="white" font-family="Arial">$</text>
  <!-- Door -->
  <rect x="68" y="88" width="24" height="24" rx="3" fill="#3A6AB0"/>
  <circle cx="87" cy="100" r="2" fill="#FFD700"/>
</svg>
