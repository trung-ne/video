<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Circle background -->
  <circle cx="80" cy="75" r="55" fill="#EBF5FB"/>
  <circle cx="80" cy="75" r="55" fill="none" stroke="#3498DB" stroke-width="4"/>
  <!-- Percent sign -->
  <text x="80" y="62" text-anchor="middle" font-size="52" font-weight="900" fill="#2980B9" font-family="Arial">%</text>
  <!-- Up arrow below -->
  <polygon points="80,110 68,95 92,95" fill="#E74C3C"/>
  <rect x="76" y="95" width="8" height="18" fill="#E74C3C"/>
  <!-- Small bars indicating rate going up -->
  <rect x="25" y="125" width="10" height="18" rx="2" fill="#3498DB" opacity="0.4"/>
  <rect x="40" y="118" width="10" height="25" rx="2" fill="#3498DB" opacity="0.6"/>
  <rect x="55" y="110" width="10" height="33" rx="2" fill="#3498DB" opacity="0.8"/>
  <rect x="70" y="100" width="10" height="43" rx="2" fill="#3498DB"/>
  <!-- Label -->
  <text x="80" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980B9" font-family="Arial">Lãi suất</text>
</svg>
