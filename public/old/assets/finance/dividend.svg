<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Main circle (dividend source) -->
  <circle cx="80" cy="70" r="35" fill="#9B59B6"/>
  <!-- Dollar sign inside -->
  <text x="80" y="80" text-anchor="middle" font-size="32" font-weight="900" fill="white" font-family="Arial">$</text>
  <!-- Distribution arrows (3 branches) -->
  <line x1="50" y1="95" x2="30" y2="125" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <polygon points="30,125 24,120 32,118" fill="#3498DB"/>
  <line x1="80" y1="105" x2="80" y2="135" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <polygon points="80,135 74,125 86,125" fill="#3498DB"/>
  <line x1="110" y1="95" x2="130" y2="125" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <polygon points="130,125 128,118 136,120" fill="#3498DB"/>
  <!-- Dividend amount circles at distribution points -->
  <circle cx="30" cy="125" r="8" fill="#2ECC71"/>
  <text x="30" y="130" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial">$</text>
  <circle cx="80" cy="135" r="8" fill="#2ECC71"/>
  <text x="80" y="140" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial">$</text>
  <circle cx="130" cy="125" r="8" fill="#2ECC71"/>
  <text x="130" y="130" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial">$</text>
  <!-- Labels -->
  <text x="25" y="150" font-size="8" fill="#666" text-anchor="middle" font-family="Arial">Investor A</text>
  <text x="80" y="150" font-size="8" fill="#666" text-anchor="middle" font-family="Arial">Investor B</text>
  <text x="135" y="150" font-size="8" fill="#666" text-anchor="middle" font-family="Arial">Investor C</text>
</svg>
