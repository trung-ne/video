<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Expense bucket draining -->
  <!-- Top of bucket -->
  <path d="M 35 80 L 28 135 Q 28 140 33 140 L 57 140 Q 62 140 62 135 L 55 80 Z" fill="#E8D5C4" stroke="#C0392B" stroke-width="2"/>
  <!-- Dollar signs inside (being spent) -->
  <text x="40" y="95" font-size="13" font-weight="900" fill="#E74C3C" font-family="Arial">$</text>
  <text x="50" y="110" font-size="11" font-weight="900" fill="#E74C3C" font-family="Arial">$</text>
  <!-- Drain/leak at bottom -->
  <circle cx="46" cy="140" r="4" fill="#E74C3C"/>
  <!-- Money flowing out -->
  <line x1="45" y1="145" x2="35" y2="160" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <polygon points="35,160 30,148 40,152" fill="#E74C3C"/>
  <!-- Dollar coins falling -->
  <circle cx="30" cy="150" r="5" fill="#FFD700" opacity="0.6"/>
  <text x="30" y="154" text-anchor="middle" font-size="8" font-weight="bold" fill="#8B6914" font-family="Arial">$</text>
  <circle cx="50" cy="158" r="4" fill="#FFD700" opacity="0.5"/>
  <text x="50" y="161" text-anchor="middle" font-size="7" font-weight="bold" fill="#8B6914" font-family="Arial">$</text>
  <!-- Expense categories (right side) -->
  <rect x="75" y="75" width="55" height="20" rx="3" fill="#FF6B6B"/>
  <text x="102" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial">Salary</text>
  <rect x="75" y="100" width="55" height="20" rx="3" fill="#FF8C7D"/>
  <text x="102" y="113" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial">Utilities</text>
  <rect x="75" y="125" width="55" height="20" rx="3" fill="#FF9E8E"/>
  <text x="102" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial">Operating</text>
  <!-- Total expense badge -->
  <circle cx="130" cy="50" r="18" fill="#C0392B"/>
  <text x="130" y="48" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial">TOTAL</text>
  <text x="130" y="59" text-anchor="middle" font-size="11" font-weight="900" fill="white" font-family="Arial">$800k</text>
</svg>
