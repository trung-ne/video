<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Chart background -->
  <rect x="15" y="20" width="130" height="100" rx="8" fill="#F8F9FA"/>
  <rect x="15" y="20" width="130" height="100" rx="8" fill="none" stroke="#DEE2E6" stroke-width="2"/>
  <!-- Grid lines -->
  <line x1="15" y1="70" x2="145" y2="70" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="15" y1="45" x2="145" y2="45" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="15" y1="95" x2="145" y2="95" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Chart line (going up) -->
  <polyline points="25,95 45,85 60,88 75,70 90,60 105,50 120,42 135,30" stroke="#27AE60" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Area fill -->
  <polygon points="25,95 45,85 60,88 75,70 90,60 105,50 120,42 135,30 135,118 25,118" fill="#27AE60" opacity="0.12"/>
  <!-- Data dots -->
  <circle cx="90" cy="60" r="4" fill="#27AE60"/>
  <circle cx="135" cy="30" r="5" fill="#27AE60" stroke="white" stroke-width="2"/>
  <!-- Arrow up -->
  <polygon points="135,30 128,42 142,42" fill="#27AE60"/>
  <!-- X axis -->
  <line x1="15" y1="118" x2="145" y2="118" stroke="#ADB5BD" stroke-width="2"/>
  <!-- Y axis -->
  <line x1="15" y1="20" x2="15" y2="118" stroke="#ADB5BD" stroke-width="2"/>
  <!-- Label -->
  <text x="80" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#27AE60" font-family="Arial">▲ Tăng trưởng</text>
</svg>
