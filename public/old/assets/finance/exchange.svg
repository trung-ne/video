<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Left currency -->
  <circle cx="45" cy="80" r="35" fill="#FF6B6B"/>
  <text x="45" y="65" text-anchor="middle" font-size="20" font-weight="900" fill="white" font-family="Arial">$</text>
  <text x="45" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="Arial">USD</text>
  <!-- Right currency -->
  <circle cx="115" cy="80" r="35" fill="#4CAF50"/>
  <text x="115" y="65" text-anchor="middle" font-size="20" font-weight="900" fill="white" font-family="Arial">€</text>
  <text x="115" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="Arial">EUR</text>
  <!-- Exchange arrows (bidirectional) -->
  <!-- Left to right -->
  <line x1="77" y1="75" x2="93" y2="75" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <polygon points="93,75 85,70 87,80" fill="#3498DB"/>
  <!-- Right to left -->
  <line x1="93" y1="85" x2="77" y2="85" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <polygon points="77,85 85,90 83,80" fill="#3498DB"/>
  <!-- Exchange rate display -->
  <rect x="55" y="120" width="50" height="25" rx="4" fill="#3498DB"/>
  <text x="80" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="Arial">1 USD =</text>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">0.92 EUR</text>
</svg>
