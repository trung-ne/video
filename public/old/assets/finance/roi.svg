<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Main circle background -->
  <circle cx="80" cy="80" r="60" fill="#E8F8F5"/>
  <circle cx="80" cy="80" r="60" fill="none" stroke="#27AE60" stroke-width="3"/>
  <!-- ROI percentage -->
  <text x="80" y="70" text-anchor="middle" font-size="36" font-weight="900" fill="#27AE60" font-family="Arial">+35%</text>
  <!-- "ROI" label -->
  <text x="80" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#27AE60" font-family="Arial">ROI</text>
  <!-- Divided chart showing investment vs return -->
  <!-- Investment box (left) -->
  <rect x="25" y="125" width="50" height="20" rx="3" fill="#3498DB"/>
  <text x="50" y="133" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial">Investment</text>
  <text x="50" y="141" text-anchor="middle" font-size="9" font-weight="900" fill="white" font-family="Arial">$10k</text>
  <!-- Return box (right) -->
  <rect x="85" y="125" width="50" height="20" rx="3" fill="#2ECC71"/>
  <text x="110" y="133" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial">Return</text>
  <text x="110" y="141" text-anchor="middle" font-size="9" font-weight="900" fill="white" font-family="Arial">$13.5k</text>
  <!-- Arrow from investment to return -->
  <line x1="75" y1="135" x2="85" y2="135" stroke="#27AE60" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="85,135 77,130 77,140" fill="#27AE60"/>
</svg>
