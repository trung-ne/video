<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Main wallet body -->
  <rect x="20" y="50" width="120" height="80" rx="8" fill="#06D6A0"/>
  <!-- Wallet flap -->
  <path d="M20,50 Q20,50 80,35 Q140,50 140,50" fill="#0EE4AC"/>
  <!-- Front pocket -->
  <rect x="30" y="65" width="100" height="50" rx="4" fill="#16EDBA"/>
  <!-- Credit card visible -->
  <rect x="45" y="75" width="45" height="30" rx="3" fill="#4361EE"/>
  <rect x="47" y="79" width="20" height="4" fill="#FF6B6B"/>
  <circle cx="100" cy="85" r="4" fill="#FF6B6B"/>
  <text x="50" y="101" font-size="8" font-weight="bold" fill="white" font-family="Arial">CARD</text>
  <!-- Wallet zipper detail -->
  <circle cx="140" cy="95" r="5" fill="#333"/>
  <!-- Coins pocket outline -->
  <rect x="30" y="65" width="100" height="50" rx="4" fill="none" stroke="#0CC99F" stroke-width="2"/>
  <!-- Shine -->
  <ellipse cx="60" cy="60" rx="20" ry="12" fill="white" opacity="0.2"/>
</svg>
