<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Circle background -->
  <circle cx="80" cy="80" r="65" fill="#E8F8F5"/>
  <circle cx="80" cy="80" r="65" fill="none" stroke="#27AE60" stroke-width="3"/>
  <!-- Dollar sign -->
  <text x="80" y="65" text-anchor="middle" font-size="48" font-weight="900" fill="#27AE60" font-family="Arial">$</text>
  <!-- Up arrow (profit indicator) -->
  <polygon points="80,100 68,85 92,85" fill="#27AE60"/>
  <rect x="76" y="85" width="8" height="25" fill="#27AE60"/>
  <!-- Profit percentage -->
  <text x="80" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#27AE60" font-family="Arial">+32%</text>
  <!-- Small coins on sides (showing abundance) -->
  <circle cx="30" cy="50" r="8" fill="#FFD700"/>
  <text x="30" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#8B6914" font-family="Arial">$</text>
  <circle cx="130" cy="110" r="7" fill="#FFD700"/>
  <text x="130" y="113" text-anchor="middle" font-size="9" font-weight="bold" fill="#8B6914" font-family="Arial">$</text>
</svg>
