<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Card body -->
  <rect x="20" y="40" width="120" height="80" rx="6" fill="#4361EE"/>
  <!-- Magnetic stripe -->
  <rect x="20" y="70" width="120" height="20" fill="#333"/>
  <!-- Chip -->
  <rect x="35" y="95" width="18" height="18" rx="2" fill="#FFD700"/>
  <rect x="39" y="99" width="3" height="3" fill="#333"/>
  <rect x="49" y="99" width="3" height="3" fill="#333"/>
  <rect x="39" y="109" width="3" height="3" fill="#333"/>
  <rect x="49" y="109" width="3" height="3" fill="#333"/>
  <!-- Cardholder name -->
  <text x="35" y="56" font-size="11" font-weight="bold" fill="white" font-family="Arial">YOUR NAME</text>
  <!-- Card number -->
  <text x="35" y="64" font-size="10" fill="rgba(255,255,255,0.8)" font-family="Arial">•••• •••• •••• 1234</text>
  <!-- Expiry -->
  <text x="100" y="75" font-size="9" fill="rgba(255,255,255,0.6)" font-family="Arial">MM/YY</text>
  <!-- CVV -->
  <text x="110" y="110" font-size="8" fill="#333" font-family="Arial">CVV</text>
  <!-- Card logo circle -->
  <circle cx="130" cy="55" r="12" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="133" cy="52" r="8" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Shine effect -->
  <path d="M20,40 Q50,50 60,48" fill="none" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>
