<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Income stream (water/flow analogy) -->
  <!-- Source (cloud/money factory) -->
  <ellipse cx="45" cy="40" rx="28" ry="24" fill="#3498DB"/>
  <!-- Dollar signs falling -->
  <text x="35" y="60" font-size="16" font-weight="900" fill="#3498DB" font-family="Arial">$</text>
  <text x="50" y="75" font-size="14" font-weight="900" fill="#3498DB" font-family="Arial">$</text>
  <text x="40" y="90" font-size="12" font-weight="900" fill="#3498DB" font-family="Arial">$</text>
  <!-- Revenue collecting bucket -->
  <path d="M 35 95 L 28 140 Q 28 145 33 145 L 57 145 Q 62 145 62 140 L 55 95 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
  <!-- Water level in bucket -->
  <rect x="33" y="125" width="24" height="15" fill="#3498DB" opacity="0.4"/>
  <!-- Counter showing total revenue -->
  <rect x="65" y="80" width="50" height="40" rx="4" fill="#F39C12"/>
  <text x="90" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">REVENUE</text>
  <text x="90" y="115" text-anchor="middle" font-size="13" font-weight="900" fill="white" font-family="Arial">$1.2M</text>
  <!-- Timeline indicator -->
  <text x="45" y="155" text-anchor="middle" font-size="9" fill="#666" font-family="Arial">This Quarter</text>
</svg>
