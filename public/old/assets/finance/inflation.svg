<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Bag of money going down in value -->
  <ellipse cx="80" cy="95" rx="46" ry="44" fill="#E67E22"/>
  <ellipse cx="80" cy="95" rx="40" ry="38" fill="#F39C12"/>
  <!-- Tie/neck of bag -->
  <rect x="66" y="52" width="28" height="14" rx="4" fill="#D35400"/>
  <!-- Opening of bag -->
  <ellipse cx="80" cy="52" rx="20" ry="8" fill="#E67E22"/>
  <!-- Dollar sign with down arrow -->
  <text x="80" y="102" text-anchor="middle" font-size="38" font-weight="900" fill="#8B4513" font-family="Arial">$</text>
  <!-- Small red down arrow overlay -->
  <polygon points="110,60 104,48 116,48" fill="#E74C3C"/>
  <rect x="107" y="60" width="6" height="14" fill="#E74C3C"/>
  <!-- Label -->
  <text x="80" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#D35400" font-family="Arial">Lạm phát</text>
</svg>
