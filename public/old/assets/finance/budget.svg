<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Pie chart circle outline -->
  <circle cx="80" cy="80" r="50" fill="none" stroke="#E6E6FA" stroke-width="4"/>
  <!-- Pie segments -->
  <!-- Blue segment (40%) -->
  <path d="M 80 30 A 50 50 0 0 1 119.1 54.9 L 97.6 67.2 A 30 30 0 0 0 80 50 Z" fill="#3498DB"/>
  <!-- Green segment (30%) -->
  <path d="M 119.1 54.9 A 50 50 0 0 1 106.7 129.1 L 84 97.5 A 30 30 0 0 0 97.6 67.2 Z" fill="#2ECC71"/>
  <!-- Orange segment (20%) -->
  <path d="M 106.7 129.1 A 50 50 0 0 1 60 129.1 L 76 97.5 A 30 30 0 0 0 84 97.5 Z" fill="#F39C12"/>
  <!-- Red segment (10%) -->
  <path d="M 60 129.1 A 50 50 0 0 1 80 30 L 80 50 A 30 30 0 0 0 76 97.5 Z" fill="#E74C3C"/>
  <!-- Center circle (donut effect) -->
  <circle cx="80" cy="80" r="30" fill="white"/>
  <text x="80" y="85" text-anchor="middle" font-size="18" font-weight="900" fill="#333" font-family="Arial">100%</text>
  <!-- Legend bars -->
  <rect x="20" y="135" width="8" height="8" fill="#3498DB"/>
  <text x="32" y="142" font-size="8" fill="#333" font-family="Arial">Housing (40%)</text>
  <rect x="20" y="148" width="8" height="8" fill="#2ECC71"/>
  <text x="32" y="155" font-size="8" fill="#333" font-family="Arial">Food (30%)</text>
  <rect x="85" y="135" width="8" height="8" fill="#F39C12"/>
  <text x="97" y="142" font-size="8" fill="#333" font-family="Arial">Transport (20%)</text>
  <rect x="85" y="148" width="8" height="8" fill="#E74C3C"/>
  <text x="97" y="155" font-size="8" fill="#333" font-family="Arial">Other (10%)</text>
</svg>
