<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Flat-vector bedroom stage. Anchor "bed": cat lies on the mattress. -->
  <!-- wall -->
  <rect width="1920" height="1080" fill="#F6E7DC"/>
  <rect width="1920" height="80" y="0" fill="#EDD8C8"/>
  <!-- floor -->
  <rect y="780" width="1920" height="300" fill="#D9B48F"/>
  <rect y="780" width="1920" height="14" fill="#C9A27D"/>
  <!-- window with sky -->
  <g>
    <rect x="1360" y="150" width="380" height="300" rx="16" fill="#BFE3F2"/>
    <rect x="1360" y="150" width="380" height="300" rx="16" fill="none" stroke="#8A5A3B" stroke-width="18"/>
    <line x1="1550" y1="150" x2="1550" y2="450" stroke="#8A5A3B" stroke-width="12"/>
    <line x1="1360" y1="300" x2="1740" y2="300" stroke="#8A5A3B" stroke-width="12"/>
    <circle cx="1460" cy="230" r="34" fill="#FFE9A8"/>
    <ellipse cx="1650" cy="260" rx="52" ry="20" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="1600" cy="360" rx="40" ry="16" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <!-- framed picture -->
  <g>
    <rect x="300" y="180" width="200" height="150" rx="8" fill="#FFF6EC" stroke="#8A5A3B" stroke-width="10"/>
    <path d="M320 300 L380 240 L430 290 L470 250 L480 300 Z" fill="#7FB77E"/>
    <circle cx="350" cy="225" r="16" fill="#FFD27F"/>
  </g>
  <!-- rug -->
  <ellipse cx="620" cy="960" rx="380" ry="70" fill="#E8A9A9" opacity="0.85"/>
  <ellipse cx="620" cy="960" rx="290" ry="52" fill="#F2C4C4" opacity="0.9"/>
  <!-- bed -->
  <g>
    <!-- headboard -->
    <rect x="880" y="470" width="560" height="200" rx="36" fill="#B3593B"/>
    <rect x="905" y="495" width="510" height="150" rx="26" fill="#C96A48"/>
    <!-- mattress -->
    <rect x="860" y="640" width="620" height="150" rx="26" fill="#FFF8EE"/>
    <!-- blanket -->
    <path d="M860 720 h620 v70 a26 26 0 0 1 -26 26 h-568 a26 26 0 0 1 -26 -26 Z" fill="#7FA9D8"/>
    <path d="M860 720 h620 v22 h-620 Z" fill="#6C94C4"/>
    <!-- pillow -->
    <rect x="920" y="596" width="190" height="84" rx="30" fill="#FFFFFF"/>
    <rect x="920" y="596" width="190" height="84" rx="30" fill="none" stroke="#E8DCCB" stroke-width="6"/>
    <!-- legs -->
    <rect x="880" y="812" width="34" height="52" rx="8" fill="#8A5A3B"/>
    <rect x="1420" y="812" width="34" height="52" rx="8" fill="#8A5A3B"/>
  </g>
  <!-- nightstand + lamp -->
  <g>
    <rect x="620" y="660" width="170" height="150" rx="14" fill="#A9764F"/>
    <rect x="640" y="690" width="130" height="40" rx="8" fill="#8A5A3B"/>
    <rect x="688" y="560" width="16" height="100" fill="#6E4A2E"/>
    <path d="M640 560 h115 l-22 -70 h-70 Z" fill="#F2B366"/>
  </g>
</svg>
