  <!-- lamp + tree -->
  <rect x="1620" y="420" width="16" height="240" fill="#4A4A4A"/>
  <circle cx="1628" cy="410" r="30" fill="#FFE9A8" stroke="#4A4A4A" stroke-width="8"/>
  <rect x="980" y="520" width="34" height="140" fill="#8A5A3B"/>
  <circle cx="997" cy="500" r="80" fill="#6FAF6F"/>
