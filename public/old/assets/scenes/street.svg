  <ellipse cx="1500" cy="180" rx="130" ry="46" fill="#FFFFFF" opacity="0.9"/>
  <!-- buildings -->
  <rect x="120" y="300" width="260" height="360" fill="#E5A6A0"/>
  <rect x="420" y="220" width="220" height="440" fill="#F2C48A"/>
  <rect x="680" y="330" width="240" height="330" fill="#A9C7E0"/>
  <rect x="1200" y="250" width="240" height="410" fill="#E9C27C"/>
  <rect x="1480" y="320" width="300" height="340" fill="#B7A6D8"/>
  <!-- windows -->
  <g fill="#FFF6EC" opacity="0.85">
    <rect x="160" y="340" width="40" height="50"/><rect x="240" y="340" width="40" height="50"/><rect x="160" y="430" width="40" height="50"/><rect x="240" y="430" width="40" height="50"/>
    <rect x="460" y="270" width="44" height="54"/><rect x="540" y="270" width="44" height="54"/><rect x="460" y="360" width="44" height="54"/><rect x="540" y="360" width="44" height="54"/>
    <rect x="1240" y="300" width="44" height="54"/><rect x="1330" y="300" width="44" height="54"/><rect x="1240" y="400" width="44" height="54"/><rect x="1330" y="400" width="44" height="54"/>
  </g>
  <!-- sidewalk + road -->
  <rect y="660" width="1920" height="120" fill="#C9C2BA"/>
  <rect y="660" width="1920" height="12" fill="#B0A99F"/>
  <rect y="780" width="1920" height="300" fill="#5C5A57"/>
