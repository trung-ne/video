<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#E7ECF0"/>
  <rect width="1920" height="70" fill="#D6DEE4"/>
  <rect y="800" width="1920" height="280" fill="#6E747A"/>
  <rect y="800" width="1920" height="14" fill="#585E64"/>
  <!-- mirror wall -->
  <rect x="120" y="150" width="700" height="440" rx="10" fill="#CFE0EC" opacity="0.8" stroke="#B0BEC8" stroke-width="10"/>
  <!-- rack of dumbbells -->
  <rect x="1360" y="470" width="440" height="120" rx="8" fill="#8A9299"/>
  <g fill="#3A4048"><circle cx="1420" cy="500" r="26"/><circle cx="1500" cy="500" r="26"/><circle cx="1580" cy="500" r="26"/><circle cx="1660" cy="500" r="26"/><circle cx="1740" cy="500" r="26"/></g>
  <g fill="#3A4048"><circle cx="1420" cy="560" r="30"/><circle cx="1520" cy="560" r="30"/><circle cx="1620" cy="560" r="30"/><circle cx="1720" cy="560" r="30"/></g>
  <!-- clock -->
  <circle cx="1000" cy="230" r="52" fill="#FFF6EC" stroke="#585E64" stroke-width="10"/>
  <line x1="1000" y1="230" x2="1000" y2="200" stroke="#3A4048" stroke-width="7"/>
  <line x1="1000" y1="230" x2="1024" y2="242" stroke="#3A4048" stroke-width="6"/>
  <!-- bench (hero) -->
  <rect x="640" y="720" width="640" height="46" rx="10" fill="#E5626B"/>
  <rect x="660" y="766" width="40" height="90" fill="#3A4048"/>
  <rect x="1220" y="766" width="40" height="90" fill="#3A4048"/>
  <!-- a barbell leaning -->
  <rect x="300" y="560" width="20" height="240" fill="#8A9299" transform="rotate(12 310 680)"/>
  <circle cx="290" cy="580" r="34" fill="#3A4048"/>
</svg>
