<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Flat-vector family dinner stage (the reference's red-table scene). -->
  <!-- Anchors: seat_left / seat_right sit BEHIND the table (table occludes laps). -->
  <!-- wall -->
  <rect width="1920" height="1080" fill="#F3E3D3"/>
  <rect width="1920" height="70" fill="#E8D2BC"/>
  <!-- floor -->
  <rect y="760" width="1920" height="320" fill="#B78E68"/>
  <!-- hanging lamp -->
  <g>
    <rect x="948" y="0" width="14" height="180" fill="#5C4632"/>
    <path d="M880 180 h150 l40 90 h-230 Z" fill="#E5626B"/>
    <ellipse cx="955" cy="286" rx="52" ry="16" fill="#FFE9A8"/>
  </g>
  <!-- framed pictures -->
  <g>
    <rect x="290" y="200" width="170" height="130" rx="8" fill="#FFF6EC" stroke="#7C6A55" stroke-width="9"/>
    <path d="M310 320 L360 260 L410 315 L440 285 L450 320 Z" fill="#7FB77E"/>
    <rect x="1500" y="190" width="140" height="170" rx="8" fill="#FFF6EC" stroke="#7C6A55" stroke-width="9"/>
    <circle cx="1570" cy="260" r="36" fill="#F2B366"/>
  </g>
  <!-- sideboard -->
  <g>
    <rect x="1560" y="560" width="280" height="180" rx="14" fill="#A9764F"/>
    <rect x="1585" y="590" width="100" height="60" rx="8" fill="#8A5A3B"/>
    <rect x="1715" y="590" width="100" height="60" rx="8" fill="#8A5A3B"/>
    <rect x="1620" y="480" width="30" height="80" fill="#5E9B5E"/>
    <ellipse cx="1635" cy="470" rx="34" ry="24" fill="#6FAF6F"/>
  </g>
  <!-- big red dinner table (front, occludes seated characters' lower half) -->
  <g>
    <path d="M240 700 h1440 l70 240 H170 Z" fill="#C0392B"/>
    <path d="M240 700 h1440 l16 56 H224 Z" fill="#D64533"/>
    <!-- place settings -->
    <ellipse cx="640" cy="820" rx="110" ry="34" fill="#FFF8EE"/>
    <ellipse cx="640" cy="814" rx="82" ry="24" fill="#F2E4CE"/>
    <ellipse cx="1280" cy="820" rx="110" ry="34" fill="#FFF8EE"/>
    <ellipse cx="1280" cy="814" rx="82" ry="24" fill="#F2E4CE"/>
    <ellipse cx="960" cy="900" rx="130" ry="40" fill="#FFF8EE"/>
    <ellipse cx="960" cy="892" rx="96" ry="28" fill="#FBD9A0"/>
    <circle cx="930" cy="888" r="14" fill="#E58F3A"/>
    <circle cx="985" cy="892" r="12" fill="#E58F3A"/>
    <!-- glasses -->
    <rect x="770" y="770" width="34" height="52" rx="8" fill="#BFE3F2" opacity="0.9"/>
    <rect x="1120" y="770" width="34" height="52" rx="8" fill="#BFE3F2" opacity="0.9"/>
  </g>
</svg>
