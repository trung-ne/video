<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-house-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF85C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F759AB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-house-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0050B3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Roof -->
  <polygon points="50,65 80,40 110,65" fill="url(#grad-house-roof)" stroke="#003A8C" stroke-width="2" opacity="0.9"/>

  <!-- Main house body -->
  <rect x="50" y="65" width="60" height="50" rx="3" fill="url(#grad-house-primary)" stroke="#C41D7F" stroke-width="2" opacity="0.9"/>

  <!-- Door -->
  <rect x="70" y="85" width="20" height="30" rx="2" fill="#C41D7F" stroke="#8B0A50" stroke-width="1.5" opacity="0.85"/>
  <circle cx="88" cy="100" r="1.5" fill="white" opacity="0.6"/>

  <!-- Windows -->
  <g opacity="0.8">
    <rect x="56" y="72" width="12" height="12" rx="1.5" fill="white" stroke="#8B0A50" stroke-width="1"/>
    <line x1="62" y1="72" x2="62" y2="84" stroke="#8B0A50" stroke-width="0.5"/>
    <line x1="56" y1="78" x2="68" y2="78" stroke="#8B0A50" stroke-width="0.5"/>

    <rect x="92" y="72" width="12" height="12" rx="1.5" fill="white" stroke="#8B0A50" stroke-width="1"/>
    <line x1="98" y1="72" x2="98" y2="84" stroke="#8B0A50" stroke-width="0.5"/>
    <line x1="92" y1="78" x2="104" y2="78" stroke="#8B0A50" stroke-width="0.5"/>
  </g>

  <!-- Foundation line -->
  <line x1="50" y1="115" x2="110" y2="115" stroke="#8B0A50" stroke-width="2" opacity="0.6"/>

  <!-- Decorative accent -->
  <rect x="50" y="63" width="60" height="2" fill="#003A8C" opacity="0.4"/>
</svg>