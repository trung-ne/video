<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Hourglass - time/patience concept -->
  <!-- Frame -->
  <rect x="48" y="10" width="64" height="14" rx="5" fill="#8B6914" stroke="#5C4008" stroke-width="2.5"/>
  <rect x="48" y="136" width="64" height="14" rx="5" fill="#8B6914" stroke="#5C4008" stroke-width="2.5"/>
  <rect x="72" y="22" width="16" height="116" rx="4" fill="#8B6914" stroke="#5C4008" stroke-width="2"/>
  <!-- Glass upper half -->
  <path d="M52,24 L108,24 L88,80 L72,80 Z" fill="#E8F4FD" stroke="#5C4008" stroke-width="2" opacity="0.85"/>
  <!-- Glass lower half -->
  <path d="M72,80 L88,80 L108,136 L52,136 Z" fill="#E8F4FD" stroke="#5C4008" stroke-width="2" opacity="0.85"/>
  <!-- Sand upper (running out) -->
  <path d="M56,28 L104,28 L86,76 L74,76 Z" fill="#F1C40F" opacity="0.7"/>
  <!-- Sand lower pile -->
  <path d="M74,110 L86,110 L100,132 L60,132 Z" fill="#F1C40F" opacity="0.9"/>
  <!-- Sand trickle -->
  <line x1="80" y1="80" x2="80" y2="112" stroke="#D4A830" stroke-width="2.5" stroke-dasharray="4,3"/>
</svg>
