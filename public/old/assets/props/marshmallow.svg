<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Marshmallow - white puffy rounded rectangle -->
  <rect x="25" y="35" width="110" height="90" rx="35" ry="35" fill="#F8F4F0" stroke="#D4C4B0" stroke-width="3"/>
  <!-- Soft crease lines -->
  <path d="M50,60 Q80,55 110,60" stroke="#DDD0C0" stroke-width="2" fill="none"/>
  <path d="M45,100 Q80,95 115,100" stroke="#DDD0C0" stroke-width="2" fill="none"/>
  <!-- Slight 3D highlight -->
  <ellipse cx="70" cy="58" rx="20" ry="10" fill="white" opacity="0.5"/>
  <!-- Stick -->
  <rect x="74" y="120" width="12" height="28" rx="4" fill="#D4A96A" stroke="#B8864E" stroke-width="2"/>
</svg>
