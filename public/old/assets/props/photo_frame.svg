<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Photo frame with torn paper / polaroid style -->
  <!-- Shadow -->
  <rect x="16" y="16" width="172" height="192" rx="4" fill="#00000022"/>
  <!-- White frame body -->
  <rect x="8" y="8" width="172" height="192" rx="4" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Photo area (placeholder - actual photo is the background image) -->
  <rect x="18" y="18" width="152" height="142" rx="2" fill="#F0F0F0"/>
  <!-- Torn paper bottom edge of photo area -->
  <path d="M18,160 Q28,155 38,160 Q48,165 58,158 Q68,152 78,158 Q88,164 98,157 Q108,150 118,156 Q128,162 138,156 Q148,150 158,156 Q165,160 170,157 L170,160 Z" fill="white"/>
  <!-- Caption area -->
  <rect x="18" y="170" width="152" height="22" rx="2" fill="white"/>
  <!-- Caption text placeholder line -->
  <rect x="30" y="177" width="108" height="8" rx="4" fill="#E8E8E8"/>
</svg>
