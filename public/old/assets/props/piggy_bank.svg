<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Piggy bank -->
  <!-- Body -->
  <ellipse cx="80" cy="95" rx="55" ry="48" fill="#F4A0B0" stroke="#D4607A" stroke-width="3"/>
  <!-- Head -->
  <circle cx="125" cy="75" r="28" fill="#F4A0B0" stroke="#D4607A" stroke-width="3"/>
  <!-- Snout -->
  <ellipse cx="140" cy="82" rx="14" ry="11" fill="#F08090" stroke="#D4607A" stroke-width="2"/>
  <circle cx="137" cy="82" r="3" fill="#C06070"/>
  <circle cx="143" cy="82" r="3" fill="#C06070"/>
  <!-- Eye -->
  <circle cx="130" cy="68" r="4" fill="#1a1a1a"/>
  <circle cx="131" cy="67" r="1.5" fill="white"/>
  <!-- Ear -->
  <ellipse cx="118" cy="52" rx="10" ry="14" fill="#F08090" stroke="#D4607A" stroke-width="2" transform="rotate(-15,118,52)"/>
  <!-- Coin slot on top -->
  <rect x="72" y="46" width="18" height="5" rx="2" fill="#D4607A"/>
  <!-- Legs -->
  <rect x="45" y="134" width="16" height="18" rx="6" fill="#F08090" stroke="#D4607A" stroke-width="2"/>
  <rect x="68" y="136" width="16" height="16" rx="6" fill="#F08090" stroke="#D4607A" stroke-width="2"/>
  <rect x="92" y="136" width="16" height="16" rx="6" fill="#F08090" stroke="#D4607A" stroke-width="2"/>
  <rect x="112" y="134" width="16" height="18" rx="6" fill="#F08090" stroke="#D4607A" stroke-width="2"/>
  <!-- Tail -->
  <path d="M28,90 Q14,78 18,68 Q22,58 32,62" fill="none" stroke="#D4607A" stroke-width="4" stroke-linecap="round"/>
  <!-- Coin symbol -->
  <circle cx="70" cy="95" r="14" fill="#F1C40F" stroke="#C0922A" stroke-width="2"/>
  <text x="70" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#8B6914" text-anchor="middle">$</text>
</svg>
