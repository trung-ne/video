<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Computer desk setup -->
  <!-- Desk surface -->
  <rect x="10" y="100" width="180" height="12" rx="4" fill="#8B6914" stroke="#5C4008" stroke-width="2"/>
  <!-- Monitor stand -->
  <rect x="88" y="72" width="24" height="28" rx="3" fill="#555"/>
  <rect x="76" y="98" width="48" height="8" rx="3" fill="#444"/>
  <!-- Monitor -->
  <rect x="45" y="20" width="110" height="56" rx="6" fill="#2C2C2C" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Screen -->
  <rect x="50" y="25" width="100" height="46" rx="3" fill="#1A1A2E"/>
  <!-- Screen glow/content -->
  <rect x="55" y="30" width="40" height="4" rx="2" fill="#00D4AA" opacity="0.8"/>
  <rect x="55" y="38" width="60" height="3" rx="2" fill="#0099FF" opacity="0.6"/>
  <rect x="55" y="45" width="50" height="3" rx="2" fill="#00D4AA" opacity="0.4"/>
  <rect x="55" y="52" width="70" height="3" rx="2" fill="#FF6B35" opacity="0.6"/>
  <rect x="55" y="59" width="45" height="3" rx="2" fill="#0099FF" opacity="0.4"/>
  <!-- Keyboard -->
  <rect x="50" y="110" width="90" height="22" rx="4" fill="#444" stroke="#333" stroke-width="1.5"/>
  <!-- Keys -->
  <rect x="54" y="114" width="6" height="5" rx="1" fill="#555"/>
  <rect x="63" y="114" width="6" height="5" rx="1" fill="#555"/>
  <rect x="72" y="114" width="6" height="5" rx="1" fill="#555"/>
  <rect x="81" y="114" width="6" height="5" rx="1" fill="#555"/>
  <rect x="90" y="114" width="6" height="5" rx="1" fill="#555"/>
  <rect x="99" y="114" width="6" height="5" rx="1" fill="#555"/>
  <rect x="108" y="114" width="6" height="5" rx="1" fill="#555"/>
  <rect x="57" y="122" width="24" height="5" rx="1" fill="#555"/>
  <rect x="84" y="122" width="5" height="5" rx="1" fill="#555"/>
  <!-- Mouse -->
  <ellipse cx="158" cy="118" rx="12" ry="15" fill="#444" stroke="#333" stroke-width="1.5"/>
  <line x1="158" y1="108" x2="158" y2="120" stroke="#333" stroke-width="1.5"/>
  <!-- Desk legs -->
  <rect x="15" y="112" width="8" height="46" rx="3" fill="#6B4F10"/>
  <rect x="177" y="112" width="8" height="46" rx="3" fill="#6B4F10"/>
</svg>
