<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Round pedestal table -->
  <!-- Table top -->
  <ellipse cx="80" cy="75" rx="68" ry="22" fill="#C0724A" stroke="#8B5230" stroke-width="3"/>
  <!-- Table top surface highlight -->
  <ellipse cx="80" cy="72" rx="64" ry="18" fill="#D4845A" stroke="none"/>
  <!-- White plate/coaster on table -->
  <ellipse cx="80" cy="68" rx="22" ry="8" fill="white" stroke="#DDD" stroke-width="2"/>
  <!-- Pedestal stem -->
  <rect x="72" y="95" width="16" height="38" rx="4" fill="#A0623A" stroke="#7A4820" stroke-width="2.5"/>
  <!-- Base -->
  <ellipse cx="80" cy="134" rx="36" ry="10" fill="#8B5230" stroke="#6B3A18" stroke-width="2.5"/>
</svg>
