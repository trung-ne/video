<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Flexed muscle arm (bicep curl) -->
  <!-- Upper arm -->
  <path d="M40,110 Q35,80 50,60 Q60,45 75,50" stroke="#F0C8A0" stroke-width="28" stroke-linecap="round" fill="none"/>
  <!-- Bicep bulge -->
  <ellipse cx="62" cy="68" rx="26" ry="22" fill="#F0C8A0" stroke="#D4A878" stroke-width="2"/>
  <!-- Forearm -->
  <path d="M75,50 Q92,42 105,55 Q115,65 110,80 Q108,90 100,95" stroke="#F0C8A0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Hand/fist -->
  <ellipse cx="96" cy="100" rx="18" ry="15" fill="#F0C8A0" stroke="#D4A878" stroke-width="2.5"/>
  <!-- Knuckle lines -->
  <path d="M84,98 Q90,95 96,97" stroke="#D4A878" stroke-width="1.5" fill="none"/>
  <path d="M86,104 Q92,101 98,103" stroke="#D4A878" stroke-width="1.5" fill="none"/>
  <!-- Muscle definition lines -->
  <path d="M50,72 Q58,65 66,70" stroke="#D4A878" stroke-width="2" fill="none"/>
  <path d="M48,78 Q56,72 64,76" stroke="#D4A878" stroke-width="1.5" fill="none"/>
</svg>
